name: Deploy Stack
on:
  push:
    branches:
    - main
concurrency:
  group: airflow-dependencies
  cancel-in-progress: false
jobs:
  deploy:
    runs-on:
    - self-hosted
    - mlops-stack
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Deploy
      run: |
        ./setup.sh
